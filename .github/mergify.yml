scopes:
  source:
    files:
      protected-scope:
        include:
          - protected/**
      benign-scope:
        include:
          - benign/**

queue_rules:
  - name: vm3-shadowcfg-scope-guard-261005
    queue_conditions:
      - scope != protected-scope
    merge_conditions:
      - base = main
    merge_method: merge
